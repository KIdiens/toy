<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提醒管理 · 玩具主机</title>
  <meta name="description" content="创建与取消提醒：时间按 Asia/Shanghai 展示、按 UTC 存储，时间不可靠时暂停绝对提醒。">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <app-topbar active="reminders"><a class="topbar__brand" href="/"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 14 4-4"></path> <path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg><span>玩具主机</span></a>
      <nav class="nav" aria-label="主导航"><a class="nav__link" href="/"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 14 4-4"></path> <path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg><span>设备状态</span></a><a class="nav__link" href="/editor"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m18 8 4 4-4 4"></path> <path d="M2 12h20"></path> <path d="m6 8-4 4 4 4"></path></svg><span>动作编排</span></a><a class="nav__link" href="/memories"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 18V5"></path> <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"></path> <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"></path> <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"></path> <path d="M18 18a4 4 0 0 0 2-7.464"></path> <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"></path> <path d="M6 18a4 4 0 0 1-2-7.464"></path> <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"></path></svg><span>记忆</span></a><a class="nav__link" href="/reminders" aria-current="page"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path> <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg><span>提醒</span></a><a class="nav__link" href="/settings"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path> <circle cx="12" cy="12" r="3"></circle></svg><span>设置</span></a></nav>
      <span class="topbar__spacer"></span>
      <div class="topbar__group"><span data-slot="">
    <conn-state-chip id="conn" state="offline"><span class="conn conn--offline" role="status" aria-live="polite">
      <span class="conn__dot" aria-hidden="true"></span><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 22v-5"></path> <path d="M15 8V2"></path> <path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"></path> <path d="M9 8V2"></path></svg>
      <span>未检测到设备</span></span></conn-state-chip>
  </span><theme-toggle><button class="btn btn--ghost" type="button" data-act="toggle" aria-pressed="false" title="切换到深色">
      <svg class="ic" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg><span class="small">深色</span></button></theme-toggle></div></app-topbar>

  <main class="read" id="main">
    <page-header icon="alarm-clock" title="提醒管理" subtitle="先看「下次会发生什么」，再决定加、改或取消。提醒存 UTC、按 Asia/Shanghai 展示。"><div class="page-head">
      <div class="page-head__ic"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8"></circle> <path d="M12 9v4l2 2"></path> <path d="M5 3 2 6"></path> <path d="m22 6-3-3"></path> <path d="M6.38 18.7 4 21"></path> <path d="M17.64 18.67 20 21"></path></svg></div>
      <div class="grow">
        <h1 class="page-head__title">提醒管理</h1>
        <p class="page-head__sub">先看「下次会发生什么」，再决定加、改或取消。提醒存 UTC、按 Asia/Shanghai 展示。</p>
      </div>
      <div class="page-head__actions" data-slot="">
      <button class="btn btn--primary" type="button" id="new-reminder">新建提醒</button>
    </div>
    </div></page-header>

    <div style="margin-bottom: var(--space-5)">
      <clock-warning id="clock-warn" state="unsynced" class=""><div class="banner banner--fault" role="status" aria-live="polite">
      <span class="banner__ic"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 6v6l4 2"></path> <path d="M20 12v5"></path> <path d="M20 21h.01"></path> <path d="M21.25 8.2A10 10 0 1 0 16 21.16"></path></svg></span>
      <span class="banner__text">设备尚未确认当前时间，按绝对时间设置的提醒已<strong>暂停</strong>，不会错发。</span>
      <span class="banner__actions"><button class="btn btn--secondary" type="button" data-act="sync">
        <svg class="ic" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path> <path d="M21 3v5h-5"></path> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path> <path d="M8 16H3v5"></path></svg>校时指引</button></span></div></clock-warning>
    </div>

    <reminder-list id="list" busy="true"><loader-skeleton rows="3"><div class="skeleton" role="status" aria-busy="true" aria-label="正在载入"><div class="sk-line " aria-hidden="true"></div><div class="sk-line sk-line--short" aria-hidden="true"></div><div class="sk-line " aria-hidden="true"></div></div></loader-skeleton></reminder-list>
    <div id="empty-slot"></div>

    <section class="section" style="margin-top: var(--space-6)">
      <reminder-form id="form" mode="create"><form class="card" data-form="" novalidate="" aria-label="新建提醒">
      <div class="section__head" style="margin-bottom:var(--space-3)">
        <span class="section__ic"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path> <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg></span>
        <h2 class="section__title">新建提醒</h2></div>
      <time-field value="20:00"><div class="field"><label class="field__label" for="rf-time">提醒时间</label>
      <input class="input" id="rf-time" type="time" data-time="" value="20:00" aria-describedby="rf-time-h"><span class="field__helper" id="rf-time-h">按设备本地时间（Asia/Shanghai）设置，存储为 UTC。</span>
      <span class="field__error hidden" data-err=""><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path> <path d="M12 9v4"></path> <path d="M12 17h.01"></path></svg><span></span></span></div></time-field>
      <repeat-picker selected="daily"><fieldset class="field" style="border:0;padding:0;margin:0 0 var(--space-4)">
      <legend class="field__label">重复</legend><div class="rowflex" role="radiogroup" aria-label="重复规则"><label class="switch small" style="min-height:auto">
      <input type="radio" name="rp-2hvqvvsc6mb" value="once" data-rep="">仅一次</label><label class="switch small" style="min-height:auto">
      <input type="radio" name="rp-2hvqvvsc6mb" value="daily" data-rep="" checked="">每天</label><label class="switch small" style="min-height:auto">
      <input type="radio" name="rp-2hvqvvsc6mb" value="weekdays" data-rep="">工作日</label></div></fieldset></repeat-picker>
      <div class="field"><label class="field__label" for="rf-text">提醒内容</label>
        <input class="input" id="rf-text" data-text="" maxlength="200" placeholder="例如：该刷牙啦" aria-describedby="rf-text-h rf-text-err">
        <span class="field__helper" id="rf-text-h">最多 200 字。夜间静音时段设备不会主动发声。</span>
        <span class="field__error hidden" id="rf-text-err"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path> <path d="M12 9v4"></path> <path d="M12 17h.01"></path></svg><span></span></span></div>
      <voice-select role-id="1"><div class="field"><label class="field__label" for="rf-voice">角色音色</label>
      <select class="select" id="rf-voice" data-voice=""><option value="1" selected="">
          小熊 · xiaoxiao</option></select>
      <span class="field__helper">未注册角色时先用默认音色。</span></div></voice-select>
      <div class="rowflex" style="justify-content:flex-end">
        <button class="btn btn--ghost" type="button" data-act="cancel">取消</button>
        <button class="btn btn--primary" type="submit" data-act="submit"><svg class="ic" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"></path></svg>保存提醒</button>
      </div></form></reminder-form>
    </section>

    <footer class="section xs meta">
      <hr class="hr">
      <p id="tz-note">共 1 条提醒 · 存储 UTC、展示 Asia/Shanghai · 创建带幂等键，重复提交不会重复创建</p>
      <div class="rowflex">
        <span>夜间静音时段设备不会主动发声；跨日/断电恢复的提醒会标注「已恢复」。</span>
        <span class="grow"></span>
        <button class="btn btn--ghost" type="button" id="retry">重试读取</button>
      </div>
    </footer>
  </main>

  <toast-stack><div class="toasts" aria-live="polite" aria-atomic="false"></div></toast-stack>
  <noscript><p style="padding: var(--space-6)">本界面需要 JavaScript。</p></noscript>
  <script type="module">
    import { boot } from '/static/app.js';
    boot('reminders');
  </script>


</body></html>
